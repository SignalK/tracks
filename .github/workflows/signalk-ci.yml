# ─────────────────────────────────────────────────────────────
# SignalK Plugin CI
#
# Calls the shared SignalK reusable workflow, which builds and
# tests this plugin across Linux x64, Linux arm64, macOS and
# Windows. Its integration slot (which starts one server and
# checks the plugin loads) stays off, because the e2e job below
# covers more: it runs this repo's own suite, which boots real
# servers, installs the packed plugin as a user would, and adds
# a real history provider backed by QuestDB.
# ─────────────────────────────────────────────────────────────

name: SignalK Plugin CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      test-command:
        description: Command to run tests
        required: false
        default: npm test
        type: string
      build-command:
        description: Command to build the plugin
        required: false
        default: npm run build --if-present
        type: string
      node-versions:
        description: 'JSON array of Node versions, example: ["20","22","24"]'
        required: false
        default: '["22","24"]'
        type: string
      enable-armv7:
        description: Run armv7 (Cerbo GX) tests via QEMU
        required: false
        default: false
        type: boolean
      enable-signalk-integration:
        description: Start SignalK server and install plugin for integration testing
        required: false
        default: false
        type: boolean

jobs:
  # ── Automatic runs (push / pull request) ──────────────────
  test-plugin-auto:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@master
    with:
      test-command: npm run typecheck && npm run lint && npm test
      build-command: npm run build --if-present
      format-check-command: npm run format:check
      node-versions: '["22","24"]'
      enable-armv7: false
      enable-signalk-integration: false

  # ── Manual runs (workflow_dispatch with custom inputs) ────
  test-plugin-manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@master
    with:
      test-command: ${{ inputs.test-command }}
      build-command: ${{ inputs.build-command }}
      node-versions: ${{ inputs.node-versions }}
      enable-armv7: ${{ inputs.enable-armv7 }}
      enable-signalk-integration: ${{ inputs.enable-signalk-integration }}

  # ── End-to-end suite against a published server ───────────
  # `npm run test:e2e` against signalk-server from npm: the oldest
  # release with the v2 Track API, which the README names as the
  # minimum, and the newest.
  e2e:
    name: e2e / signalk-server ${{ matrix.signalk-server }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        signalk-server: ['2.33.0', 'latest']
    services:
      # The image signalk-questdb runs for its users. The plugin is
      # configured not to manage a container, only to reach this one.
      questdb:
        image: questdb/questdb:latest
        ports:
          - 9000:9000
          - 9009:9009
          - 8812:8812
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install signalk-server ${{ matrix.signalk-server }}
        env:
          SIGNALK_SERVER_VERSION: ${{ matrix.signalk-server }}
        run: |
          mkdir -p "$RUNNER_TEMP/signalk"
          cd "$RUNNER_TEMP/signalk"
          npm init -y > /dev/null
          npm install "signalk-server@$SIGNALK_SERVER_VERSION"
          node -p "'signalk-server ' + require('./node_modules/signalk-server/package.json').version"

      # The service is up before the steps start, but QuestDB takes a few
      # seconds more to answer queries.
      - name: Wait for QuestDB
        run: curl --silent --fail --retry 30 --retry-delay 2 --retry-all-errors --output /dev/null 'http://localhost:9000/exec?query=select%201'

      - name: Run the e2e suite
        env:
          SIGNALK_SERVER_DIR: ${{ runner.temp }}/signalk/node_modules/signalk-server
          QUESTDB_URL: http://localhost:9000
          QUESTDB_REQUIRED: 'true'
        run: npm run test:e2e
