# ─────────────────────────────────────────────────────────────
# Release and publish on tag
#
# Publishes the tag it runs on to npm. Release tags come from
# release-please: merging its release PR creates the tag and the
# GitHub Release, then release-please.yml dispatches this workflow
# on the tag. Pre-release tags (-beta., -rc., -alpha.) are pushed by
# hand, and only a pushed tag gets its GitHub Release created here.
#
# Either way the notes are generated from the PR titles merged since
# the previous tag, so release notes come from the commit history
# rather than a hand-maintained CHANGELOG file.
# .github/release.yml groups those titles into sections by PR label.
#
# Publishing from the tag is what keeps the npm version and the
# repository in step. Publishing by hand let them drift, which is
# https://github.com/SignalK/tracks/issues/17.
#
# The repo also carries historical m* tags from when @signalk/tracks
# was published as a separate module; generate_release_notes picks the
# previous tag across all of them, so those older m* tags still bound
# the diff for the first v* release cut after this comment was written.
# ─────────────────────────────────────────────────────────────

name: Release on tag

on:
  push:
    tags:
      - 'v*'
  # How release-please.yml starts this on a tag it created: that tag, pushed
  # with GITHUB_TOKEN, raises no push event.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A dispatched run is on a tag release-please made, and release-please made
  # its Release too; creating one here would be a second for the same tag.
  release:
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release
    # Runs after the Release on a pushed tag, and without it on a dispatched
    # one, where that job is skipped. A dispatch can name any ref; only a
    # release tag is published.
    if: ${{ !cancelled() && needs.release.result != 'failure' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      # Trusted publishing: npm exchanges this token for publish rights, so no
      # NPM_TOKEN secret is needed and the tarball carries a provenance
      # attestation. Requires package.json `repository.url` to match this repo.
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The published tarball is built here, so make sure nothing from the
      # runner image or a previous step leaks into it.
      - name: Clean workspace
        run: git clean -xfd

      # Node 24 bundles npm 11, which is the first line that performs the OIDC
      # token exchange. Older npm skips it silently and the publish 404s.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # prepublishOnly runs typecheck, lint and build, so a tag that does not
      # compile cannot reach the registry.
      - name: Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
          echo "tag and package.json agree on $PKG"

      - name: Publish
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-beta.* || "${GITHUB_REF_NAME}" == *-rc.* || "${GITHUB_REF_NAME}" == *-alpha.* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
