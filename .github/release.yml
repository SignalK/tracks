# Categories for the release notes GitHub generates at tag time, so the
# changelog comes from merged PRs rather than a hand-maintained file that goes
# stale. release-please asks GitHub for these notes (changelog-type: github in
# release-please-config.json), and so does release_on_tag.yml for a pre-release
# tag pushed by hand.
#
# A PR lands in the first category it matches, so order matters: dependencies
# are listed before the catch-all, and the catch-all is last.
#
# Categories match on labels, which workflows/label-by-title.yml sets from each
# PR's Conventional Commit title. The dependency category also matches the bot by
# author. A label set by hand places a PR the same way; an unlabelled one still
# appears, under Other.
changelog:
  exclude:
    labels:
      - skip-changelog
      # release-please's own release PR, merged right before each tag —
      # it would otherwise list itself.
      - 'autorelease: pending'
      - 'autorelease: tagged'
  categories:
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Fixes
      labels:
        - bug
        - fix
    - title: 📖 Documentation
      labels:
        - documentation
    - title: 📦 Dependencies
      labels:
        - dependencies
      authors:
        - dependabot
    - title: Other
      labels:
        - '*'
