version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    # release-please.yml reads the scope: a `deps` bump ships, `deps-dev` does not.
    commit-message:
      prefix: build
      include: scope
    # The Signal K server runs express 4, and the tests must route the way it does.
    ignore:
      - dependency-name: express
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/express'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    # An action bump changes nothing users get, so it is not a build(deps) one.
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types:
          - minor
          - patch
